<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatQuest Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="card" class="hidden" data-type="combat">
    <div class="row top">
      <span id="icon" class="icon">🎲</span>
      <div class="titles">
        <div id="type" class="type">quest</div>
        <div id="title">Waiting for quest…</div>
      </div>
      <button id="mute" class="mute" type="button" title="Toggle sound cues" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="bar"><div id="fill"></div><div id="shine"></div></div>
    <div id="meta">
      <span id="progress">0 / 0</span>
      <span class="dot">·</span>
      <span id="heroes">0</span> heroes
    </div>
    <div id="party" class="party"></div>
    <div id="dice"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
